name: Rust client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publication audit
        run: python scripts/audit_publication.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Comparison integrity
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build native client
        run: cargo build -p rmc-client --locked
