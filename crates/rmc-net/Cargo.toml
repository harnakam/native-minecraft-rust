[package]
name = "rmc-net"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
aes = "0.8"
cfb8 = "0.8"
flate2 = "1"
hickory-resolver = "0.24"
num-bigint = "0.4"
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
