[package]
name = "rmc-client"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
arboard = "3"
font8x8 = "0.3"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
pixels = "0.13"
rmc-game = { path = "../rmc-game" }
rmc-java = { path = "../rmc-java" }
rmc-net = { path = "../rmc-net" }
rmc-render = { path = "../rmc-render" }
rmc-ui = { path = "../rmc-ui" }
rmc-world = { path = "../rmc-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
winit = "0.28"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
